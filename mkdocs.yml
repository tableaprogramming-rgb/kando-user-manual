site_name: Kando User Manual
site_description: Complete user guide for the Kando workforce management system
site_url: https://help.kando.com/
repo_url: https://dev.azure.com/kando-hcms/Kando%20Web%20Application/_git/kando-user-manual
repo_name: kando-user-manual

theme:
  name: material
  palette:
    - scheme: light
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: dark
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  logo: assets/logo.png
  favicon: assets/favicon.ico

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|&#?\w+;'

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md

  - Getting Started:
      - Introduction: 1-Getting-Started/1.1-Introduction.md
      - Login & Setup: 1-Getting-Started/1.2-Login-Setup.md
      - Dashboard Overview: 1-Getting-Started/1.3-Dashboard-Overview.md

  - Employee Guide:
      - Time Tracking: 2-Employee-Guide/2.1-Time-Tracking.md
      - Leave Management: 2-Employee-Guide/2.2-Leave-Management.md
      - View Schedule: 2-Employee-Guide/2.3-View-Schedule.md
      - Payslip & Compensation: 2-Employee-Guide/2.4-Payslip-Compensation.md

  - Manager Guide:
      - Team Management: 3-Manager-Guide/3.1-Team-Management.md
      - Approving Requests: 3-Manager-Guide/3.2-Approving-Requests.md
      - Create Schedules: 3-Manager-Guide/3.3-Scheduling.md
      - Team Reports: 3-Manager-Guide/3.4-Reports.md

  - HR Admin Guide:
      - System Setup: 4-HR-Admin-Guide/4.1-System-Setup.md
      - User Management: 4-HR-Admin-Guide/4.2-User-Management.md
      - Policy Configuration: 4-HR-Admin-Guide/4.3-Policy-Configuration.md
      - Payroll Management: 4-HR-Admin-Guide/4.4-Payroll-Management.md

  - Common Workflows:
      - New Employee Onboarding: 5-Workflows/5.1-Onboarding.md
      - Leave Approval Process: 5-Workflows/5.2-Leave-Approval.md
      - Monthly Payroll: 5-Workflows/5.3-Payroll-Process.md
      - Shift Scheduling: 5-Workflows/5.4-Shift-Scheduling.md

  - Troubleshooting:
      - Login Issues: 6-Troubleshooting/6.1-Login-Issues.md
      - Time Tracking Issues: 6-Troubleshooting/6.2-Time-Tracking-Issues.md
      - Request Issues: 6-Troubleshooting/6.3-Request-Issues.md
      - General Issues: 6-Troubleshooting/6.4-General-Issues.md

  - Reference:
      - Glossary: 7-Reference/7.1-Glossary.md
      - Keyboard Shortcuts: 7-Reference/7.2-Keyboard-Shortcuts.md
      - FAQ: 7-Reference/7.3-FAQ.md
      - Getting Help: 7-Reference/7.4-Getting-Help.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/
  generator: false

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2026 Kando Project. User Manual for Kando Workforce Management System.
